---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    name: PlatformIO Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('library.json', 'library.properties', '.github/workflows/ci.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Validate PlatformIO package metadata
        run: pio package pack --output /tmp

      - name: Build SyncClient example
        run: python -m platformio ci -l . --board esp12e examples/SyncClient
